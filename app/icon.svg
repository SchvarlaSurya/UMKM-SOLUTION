<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>ruangmargin</title>

  <!--
    Tiga batang menanjak dengan batang tertinggi berubah jadi siluet sendok
    takar. Grafiknya menyatakan "alat ukur", sendoknya menyatakan "dapur".

    Warna ditulis langsung: berkas ini dibaca peramban sebagai gambar, di luar
    jangkauan custom property CSS. Nilainya menyalin token yang dipakai
    IconLogo, yaitu foreground #202e28 dan warning #b45309; kalau salah satunya
    berubah, berkas ini ikut disesuaikan manual.
  -->
  <rect width="64" height="64" rx="18" fill="#fff5eb" />

  <rect x="12" y="38" width="10" height="14" rx="2.5" fill="#202e28" />
  <rect x="26" y="29" width="10" height="23" rx="2.5" fill="#202e28" />

  <rect x="40" y="22" width="10" height="30" rx="2.5" fill="#b45309" />
  <ellipse cx="45" cy="18" rx="7.5" ry="7" fill="#b45309" />
</svg>
