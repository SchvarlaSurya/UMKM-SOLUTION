<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>ruangmargin</title>

  <!--
    Konsep "ruang margin": dua balok tebal mengapit sebuah celah.

    Balok atas harga jual, balok bawah modal, dan jarak di antaranya adalah
    margin — satu-satunya bagian yang benar-benar jadi milik pemilik usaha.
    Celah itu tidak dibiarkan kosong: di dalamnya berdiri huruf "r" dari
    "ruang", sekaligus membuat celahnya terbaca sebagai ruang yang dijaga,
    bukan sekadar sela.

    Hurufnya sengaja besar dan bertangkai tebal. Versi yang lebih kecil dan
    proporsional sudah dicoba dan luruh jadi noda di petak 16px yang dipakai
    tab peramban.

    Warna ditulis langsung karena berkas ini dibaca peramban sebagai gambar,
    di luar jangkauan custom property CSS.
  -->
  <rect width="64" height="64" rx="18" fill="#17634b" />

  <!-- Balok harga jual -->
  <rect x="11" y="10" width="42" height="9" rx="3" fill="#ffffff" />

  <!-- Huruf "r" yang berdiri di dalam celah -->
  <rect x="21" y="23" width="8" height="18" rx="1.5" fill="#ffffff" />
  <rect x="29" y="23" width="14" height="8" rx="3" fill="#ffffff" />

  <!-- Balok modal -->
  <rect x="11" y="45" width="42" height="9" rx="3" fill="#ffffff" />
</svg>
