<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>ruangmargin</title>

  <!--
    Ikon peramban, diturunkan dari IconLogo di sidebar.

    Bukan salinan persis, dan itu disengaja. Logo aslinya punya dua pasang daun
    dengan tangkai setebal 1,4 pada kanvas 24 — di petak 16px, ukuran yang
    dipakai tab peramban, semua itu luruh jadi gumpalan kelabu. Versi ini
    menyisakan satu pasang daun dan pucuknya, ditebalkan sampai bentuknya masih
    terbaca sebagai tunas saat kecil.

    Latarnya kotak membulat hijau primary (#17634b) dengan tanda putih, sama
    seperti petak logo di sidebar. Warnanya ditulis langsung karena berkas ini
    dibaca peramban sebagai gambar, di luar jangkauan custom property CSS.
  -->
  <rect width="64" height="64" rx="18" fill="#17634b" />

  <!-- Tangkai -->
  <path d="M32 54V22" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />

  <!-- Sepasang daun -->
  <path d="M32 40c-9 0-14.6-3.7-15.8-10.5 7.1-2.8 13.9-.6 15.8 10.5Z" fill="#ffffff" />
  <path d="M32 40c9 0 14.6-3.7 15.8-10.5-7.1-2.8-13.9-.6-15.8 10.5Z" fill="#ffffff" />

  <!-- Pucuk -->
  <path d="M32 22c0-6.5 3.4-11.1 9.3-13.3.6 7.4-3.1 11.8-9.3 13.3Z" fill="#ffffff" />
</svg>
